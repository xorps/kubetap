version: "2"
run:
  tests: false
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - err113
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - gocognit
    - godoclint
    - godox
    - gomodguard
    - inamedparam
    - ireturn
    - lll
    - mnd
    - nlreturn
    - noinlineerr
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
