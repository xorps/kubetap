name: kubectl-tap
on:
  push:
    # trigger on push to master
    branches: [master]
    # and on semver tag
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    name: Go build kubectl-tap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go env
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Lint and Test
        run: go generate ./...
      - name: Build
        run: go install -v -trimpath -ldflags="-s -w" ./cmd/kubectl-tap
      - name: Integration Test
        run: ./scripts/ig-test.zsh

  docker:
    timeout-minutes: 20
    name: ghcr.io/${{ github.repository_owner }}/kubectl-tap:${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: latest
            dockerfile: Dockerfile
            suffix: ""
          - variant: alpine
            dockerfile: Dockerfile.alpine
            suffix: "-alpine"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kubectl-tap
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kubectl-tap-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=kubectl-tap-${{ matrix.variant }}

  release:
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    name: Release kubectl-tap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go env
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
