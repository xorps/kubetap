name: Push ghcr.io/xorps/kubetap-mitmproxy
on:
  # rebuild and push the container, updating dependencies, every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [master]
    paths:
      - 'proxies/mitmproxy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kubetap-mitmproxy:
    timeout-minutes: 20
    name: Build and push mitmproxy to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./proxies/mitmproxy
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kubetap-mitmproxy:latest
